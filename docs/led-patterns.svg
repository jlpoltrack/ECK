<rect x="636.7" y="216" width="16.7" height="16" rx="3" fill="#2f6fd6"/>
<rect x="14" y="244" width="672" height="40" rx="3" fill="#f4f6f8"/>
<text x="20" y="261" font-size="12" font-weight="bold" fill="#222">Pairing</text>
<text x="20" y="276" font-size="11" fill="#555">After Fn + Ctrl + 1-4 in standby, or while the host shows a passkey</text>
<rect x="470" y="262" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="256" width="8.3" height="16" rx="3" fill="#2f6fd6"/>
