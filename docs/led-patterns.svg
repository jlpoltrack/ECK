<svg xmlns="http://www.w3.org/2000/svg" width="700" height="787" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#222">LED Patterns</text>
