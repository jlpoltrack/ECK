name: CI
on:
  push:
    paths-ignore: ['**.md', 'docs/**', '**.png', '**.jpg', '**.svg', '**.pdf'] # not evaluated for tag pushes
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '**.png', '**.jpg', '**.svg', '**.pdf']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # release on v* tags
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tag
        with:
          enable-cache: false # no uv.lock to key it on
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y clang cmake zsh zip
      # Arm GNU Toolchain 15.3.Rel2, the compiler the bench builds use, so releases match tested binaries.
      - name: Cache Arm GNU Toolchain
        uses: actions/cache@v6
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-15.3.rel2-x86_64
      - name: Fetch Arm GNU Toolchain
        run: |
          if [ ! -d ~/arm-gnu-toolchain/bin ]; then
            curl -sfL -o /tmp/gcc.tar.xz "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel2/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-eabi.tar.xz"
            echo "463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a  /tmp/gcc.tar.xz" | sha256sum -c
            mkdir -p ~/arm-gnu-toolchain && tar -xJf /tmp/gcc.tar.xz -C ~/arm-gnu-toolchain --strip-components=1
          fi
          echo ~/arm-gnu-toolchain/bin >> "$GITHUB_PATH"
          ~/arm-gnu-toolchain/bin/arm-none-eabi-gcc --version | head -1
      - name: Host tests
        run: tests/run_all_tests.sh
      # Nordic's nRF5 SDK 17.1.1 (sources and the S132 v7.2.0 SoftDevice), next to the repo where build.sh looks.
      - name: Cache nRF5 SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.workspace }}/nRF5_SDK_17.1.1 # = ../ (the cache action rejects '..')
          key: nrf5-sdk-17.1.1-8173c8a
      - name: Fetch nRF5 SDK
        run: |
          [ -d ../nRF5_SDK_17.1.1 ] && exit 0
          curl -sfL -o /tmp/sdk.zip https://files.nordicsemi.com/artifactory/nRF5-SDK/external/nRF5_SDK_v17.x.x/nRF5_SDK_17.1.1_8173c8a.zip
          echo "8c3e6a1b9b70c2fb79180e6d9e05d8cfae35f94bf504f15c5fc1a8a9f1f97e7d  /tmp/sdk.zip" | sha256sum -c
          unzip -q /tmp/sdk.zip -d ../nRF5_SDK_17.1.1
      - name: Hybrid (nRF52 app, STM32 and .hfb)
        run: ./build.sh hybrid -c && test -f build/hybrid/hhkb_ec_hybrid.hfb
      - uses: actions/upload-artifact@v7
        with:
          name: hybrid
          path: |
            build/hybrid/hhkb_ec_hybrid.bin
            build/hybrid/hhkb_ec_hybrid.hfb
            nrf52/_build/nrf52832_xxaa.bin
      - name: Classic
        run: ./build.sh classic -c
      - name: Classic Type-S
        run: ./build.sh type_s -c
      - name: Realforce R3S
        run: ./build.sh r3s -c && test -f build/r3s/hhkb_ec_r3s.rfb
      - name: Hybrid boot stub
        run: make -C stm32/boot
      # A v* tag publishes a release: the .hfb and .rfb files, the boot stub, and the web flasher with them bundled.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/web_bundle.sh "$GITHUB_REF_NAME"
          (cd web && zip -qr "../eck-web-flasher-$GITHUB_REF_NAME.zip" . -x eck.test.mjs)
          zip -qj "eck-web-flasher-$GITHUB_REF_NAME.zip" LICENSE THIRD_PARTY_NOTICES.md
          # A re-pushed tag (history squash) keeps its existing release
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --title "ECK $GITHUB_REF_NAME" --generate-notes \
            web/firmware/*.hfb web/firmware/hhkb_ec_r3s.rfb web/firmware/hybrid_boot.bin "eck-web-flasher-$GITHUB_REF_NAME.zip" \
            stm32/via/via.json web/firmware/r3s_via.json LICENSE THIRD_PARTY_NOTICES.md
