<rect x="520.0" y="256" width="8.3" height="16" rx="3" fill="#2f6fd6"/>
<rect x="536.7" y="256" width="8.3" height="16" rx="3" fill="#2f6fd6"/>
<rect x="553.3" y="256" width="8.3" height="16" rx="3" fill="#2f6fd6"/>
<rect x="570.0" y="256" width="8.3" height="16" rx="3" fill="#2f6fd6"/>
<rect x="586.7" y="256" width="8.3" height="16" rx="3" fill="#2f6fd6"/>
