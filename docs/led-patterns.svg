<text x="20" y="156" font-size="11" fill="#555">Fn + Ctrl + 1-4, or a light press of the switch: 1-4 blinks (4 shown)</text>
<rect x="470" y="142" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="136" width="20.0" height="16" rx="3" fill="#2f6fd6"/>
