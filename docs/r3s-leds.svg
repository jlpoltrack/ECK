<text x="20" y="462" font-size="14" font-weight="bold" fill="#222" text-anchor="start">Multiplexing (ECK): one LED at a time, so each has its own colour</text>
<text x="20" y="482" font-size="12" fill="#444" text-anchor="start">TIM21 runs at 1 kHz. Each 1 ms slot lights the next LED (Num, Caps, Scroll, Simple Mode) in its colour;</text>
<text x="20" y="498" font-size="12" fill="#444" text-anchor="start">a compare ends it early for brightness (set in VIA, 5-25 %; 20 % shown: lit 0.8 ms of every 4 ms). Example: Caps red, Simple Mode blue.</text>
<text x="120" y="535" font-size="12" fill="#222" text-anchor="end">Num Lock</text>
<rect x="130" y="529" width="544" height="4" rx="2" fill="#dde1e6"/>
<text x="120" y="561" font-size="12" fill="#222" text-anchor="end">Caps Lock</text>
<rect x="130" y="555" width="544" height="4" rx="2" fill="#dde1e6"/>
<rect x="164.0" y="549" width="27.2" height="16" rx="2" fill="#d93a3a"/>
<rect x="300.0" y="549" width="27.2" height="16" rx="2" fill="#d93a3a"/>
<rect x="436.0" y="549" width="27.2" height="16" rx="2" fill="#d93a3a"/>
<rect x="572.0" y="549" width="27.2" height="16" rx="2" fill="#d93a3a"/>
