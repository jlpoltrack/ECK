<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#222">DIP switches (back of the keyboard, read at power-on)</text>
<text x="20" y="56" font-size="12" fill="#555">SW1 and SW2 select the mode. Fn + Ctrl + W switches Mac ↔ Win (or HHK) until power-off.</text>
<text x="20" y="84" font-size="12" font-weight="bold" fill="#222">SW1</text>
<text x="70" y="84" font-size="12" font-weight="bold" fill="#222">SW2</text>
<text x="120" y="84" font-size="12" font-weight="bold" fill="#222">Mode</text>
<text x="240" y="84" font-size="12" font-weight="bold" fill="#222">What changes</text>
<rect x="14" y="94" width="672" height="28" rx="3" fill="#f4f6f8"/>
<text x="20" y="114" font-size="12" font-weight="bold" fill="#222">OFF</text>
<text x="70" y="114" font-size="12" fill="#444">OFF</text>
<text x="120" y="114" font-size="12" fill="#444">HHK (default)</text>
<text x="240" y="114" font-size="12" fill="#444">Fn + right ◇ sends Stop</text>
<text x="20" y="142" font-size="12" font-weight="bold" fill="#222">ON</text>
<text x="70" y="142" font-size="12" fill="#444">OFF</text>
<text x="120" y="142" font-size="12" fill="#444">Win</text>
<text x="240" y="142" font-size="12" fill="#444">No extras</text>
<rect x="14" y="150" width="672" height="28" rx="3" fill="#f4f6f8"/>
<text x="20" y="170" font-size="12" font-weight="bold" fill="#222">OFF</text>
<text x="70" y="170" font-size="12" fill="#444">ON</text>
<text x="120" y="170" font-size="12" fill="#444">Mac</text>
<text x="240" y="170" font-size="12" fill="#444">Delete is Backspace, Fn + Delete is forward Delete (SW3 ignored)</text>
<text x="20" y="198" font-size="12" font-weight="bold" fill="#222">ON</text>
<text x="70" y="198" font-size="12" fill="#444">ON</text>
<text x="120" y="198" font-size="12" fill="#444">HHK</text>
<text x="240" y="198" font-size="12" fill="#444">As OFF/OFF</text>
<text x="20" y="232" font-size="12" font-weight="bold" fill="#222">Switch</text>
<text x="90" y="232" font-size="12" font-weight="bold" fill="#222">OFF</text>
<text x="390" y="232" font-size="12" font-weight="bold" fill="#222">ON</text>
<rect x="14" y="242" width="672" height="44" rx="3" fill="#f4f6f8"/>
<text x="20" y="262" font-size="12" font-weight="bold" fill="#222">SW3</text>
<text x="90" y="262" font-size="12" fill="#444">Delete key is Delete</text>
<text x="90" y="278" font-size="12" fill="#444">Fn + Delete is Backspace</text>
<text x="390" y="262" font-size="12" fill="#444">Delete key is Backspace</text>
<text x="390" y="278" font-size="12" fill="#444">Fn + Delete is Delete</text>
<text x="20" y="306" font-size="12" font-weight="bold" fill="#222">SW4</text>
<text x="90" y="306" font-size="12" fill="#444">Left ◇ is ◇</text>
<text x="390" y="306" font-size="12" fill="#444">Left ◇ is Fn</text>
<rect x="14" y="314" width="672" height="28" rx="3" fill="#f4f6f8"/>
<text x="20" y="334" font-size="12" font-weight="bold" fill="#222">SW5</text>
<text x="90" y="334" font-size="12" fill="#444">Alt and ◇ in their stock places</text>
<text x="390" y="334" font-size="12" fill="#444">Alt and ◇ swapped on both sides</text>
<text x="20" y="362" font-size="12" font-weight="bold" fill="#222">SW6</text>
<text x="90" y="362" font-size="12" fill="#444">Hybrid: power saving (keys don't wake the</text>
<text x="90" y="378" font-size="12" fill="#444">computer), auto power-off on batteries</text>
<text x="90" y="394" font-size="12" fill="#444">Classic: normal</text>
<text x="390" y="362" font-size="12" fill="#444">Hybrid: keys wake the computer, no auto</text>
<text x="390" y="378" font-size="12" fill="#444">power-off</text>
<text x="390" y="394" font-size="12" fill="#444">Classic: Bank 1 recovery</text>
<text x="20" y="424" font-size="12" fill="#555">The switches change only keys that still hold their default keycodes, so Vial / VIA remaps are kept.</text>
</svg>
