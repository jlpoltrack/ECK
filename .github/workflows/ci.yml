name: CI
on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # release on v* tags
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tag
        with:
          enable-cache: false # no uv.lock to key it on
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi clang cmake zsh zip
      - name: Host tests
        run: tests/run_all_tests.sh
      # Nordic's nRF5 SDK 15.0.0 (sources and the S132 v6.0.0 SoftDevice), next to the repo where build.sh looks.
      - name: Cache nRF5 SDK
        uses: actions/cache@v6
        with:
          path: ../nRF5_SDK_15.0.0
          key: nrf5-sdk-15.0.0-a53641a
      - name: Fetch nRF5 SDK
        run: |
          [ -d ../nRF5_SDK_15.0.0 ] && exit 0
          curl -sfL -o /tmp/sdk.zip https://files.nordicsemi.com/artifactory/nRF5-SDK/external/nRF5_SDK_v15.x.x/nRF5_SDK_15.0.0_a53641a.zip
          echo "7594138e5bfdcec2c69786491935bedc349b5672751d90fdea461b740f7e65b7  /tmp/sdk.zip" | sha256sum -c
          unzip -q /tmp/sdk.zip -d /tmp/sdk && mv /tmp/sdk/nRF5_SDK_15.0.0_a53641a ../nRF5_SDK_15.0.0
      - name: Hybrid (nRF52 app, STM32 and .hfb)
        run: ./build.sh hybrid -c && test -f build/hybrid/hhkb_ec_hybrid.hfb
      - uses: actions/upload-artifact@v7
        with:
          name: hybrid
          path: |
            build/hybrid/hhkb_ec_hybrid.bin
            build/hybrid/hhkb_ec_hybrid.hfb
            nrf52/_build/nrf52832_xxaa.bin
      - name: Classic
        run: ./build.sh classic -c
      - name: Classic Type-S
        run: ./build.sh type_s -c
      - name: Hybrid boot stub
        run: make -C stm32/boot
      # A v* tag publishes a release: the three .hfb files, the boot stub, and the web flasher with them bundled.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/web_bundle.sh "$GITHUB_REF_NAME"
          (cd web && zip -qr "../eck-web-flasher-$GITHUB_REF_NAME.zip" . -x eck.test.mjs)
          gh release create "$GITHUB_REF_NAME" --title "ECK $GITHUB_REF_NAME" --generate-notes \
            web/firmware/*.hfb web/firmware/hybrid_boot.bin "eck-web-flasher-$GITHUB_REF_NAME.zip"
