<svg xmlns="http://www.w3.org/2000/svg" width="700" height="696" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#222" text-anchor="start">R3S Indicator LEDs</text>
<text x="20" y="50" font-size="12" fill="#444" text-anchor="start">Each RGB LED lights a colour when its select line AND that colour line are high (both active high).</text>
<text x="20" y="66" font-size="12" fill="#444" text-anchor="start">Drawn from the firmware's pin use; the driver transistors between the chip and the LEDs aren't known.</text>
