<rect x="130" y="581" width="544" height="4" rx="2" fill="#dde1e6"/>
<text x="120" y="613" font-size="12" fill="#222" text-anchor="end">Simple Mode</text>
<rect x="130" y="607" width="544" height="4" rx="2" fill="#dde1e6"/>
<rect x="232.0" y="601" width="27.2" height="16" rx="2" fill="#2f6fd6"/>
<rect x="368.0" y="601" width="27.2" height="16" rx="2" fill="#2f6fd6"/>
<rect x="504.0" y="601" width="27.2" height="16" rx="2" fill="#2f6fd6"/>
<rect x="640.0" y="601" width="27.2" height="16" rx="2" fill="#2f6fd6"/>
<text x="130" y="638" font-size="10" fill="#888" text-anchor="middle">0 ms</text>
<text x="266" y="638" font-size="10" fill="#888" text-anchor="middle">4 ms</text>
<text x="402" y="638" font-size="10" fill="#888" text-anchor="middle">8 ms</text>
<text x="538" y="638" font-size="10" fill="#888" text-anchor="middle">12 ms</text>
<text x="674" y="638" font-size="10" fill="#888" text-anchor="middle">16 ms</text>
<text x="20" y="662" font-size="12" fill="#444" text-anchor="start">Confirmation blinks (VIA mode) light Simple Mode alone in blue. Before a firmware update the chip stops</text>
<text x="20" y="678" font-size="12" fill="#444" text-anchor="start">multiplexing and leaves Simple Mode lit magenta (red + blue) while ST's loader runs.</text>
</svg>
