<rect x="590.0" y="136" width="20.0" height="16" rx="3" fill="#2f6fd6"/>
<rect x="14" y="164" width="672" height="40" rx="3" fill="#f4f6f8"/>
<text x="20" y="181" font-size="12" font-weight="bold" fill="#222">USB</text>
<text x="20" y="196" font-size="11" fill="#555">Fn + Ctrl + 0, or a light press of the switch on USB</text>
<rect x="470" y="182" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="176" width="66.7" height="16" rx="3" fill="#2f6fd6"/>
<text x="20" y="221" font-size="12" font-weight="bold" fill="#222">Pairing standby</text>
<text x="20" y="236" font-size="11" fill="#555">After Fn + Ctrl + Q, up to 10 min</text>
<rect x="470" y="222" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="216" width="16.7" height="16" rx="3" fill="#2f6fd6"/>
