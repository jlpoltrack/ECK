<text x="530.6666666666666" y="74" font-size="10" fill="#888">1 s</text>
<text x="597.3333333333334" y="74" font-size="10" fill="#888">2 s</text>
<text x="664.0" y="74" font-size="10" fill="#888">3 s</text>
<rect x="14" y="84" width="672" height="40" rx="3" fill="#f4f6f8"/>
<text x="20" y="101" font-size="12" font-weight="bold" fill="#222">Turning on</text>
<text x="20" y="116" font-size="11" fill="#555">Lit while the power switch is held, then 1 s</text>
