<rect x="620.0" y="256" width="8.3" height="16" rx="3" fill="#2f6fd6"/>
<rect x="636.7" y="256" width="8.3" height="16" rx="3" fill="#2f6fd6"/>
<rect x="653.3" y="256" width="8.3" height="16" rx="3" fill="#2f6fd6"/>
<text x="20" y="301" font-size="12" font-weight="bold" fill="#222">Pairing cancelled</text>
<text x="20" y="316" font-size="11" fill="#555">Fn + Ctrl + X</text>
<rect x="470" y="302" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="296" width="66.7" height="16" rx="3" fill="#2f6fd6"/>
<rect x="14" y="324" width="672" height="40" rx="3" fill="#f4f6f8"/>
<text x="20" y="341" font-size="12" font-weight="bold" fill="#222">Win / Mac</text>
<text x="20" y="356" font-size="11" fill="#555">Fn + Ctrl + W: 1 blink Win (or HHK), 2 blinks Mac (Mac shown)</text>
<rect x="470" y="342" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="336" width="20.0" height="16" rx="3" fill="#2f6fd6"/>
<rect x="510.0" y="336" width="20.0" height="16" rx="3" fill="#2f6fd6"/>
<text x="20" y="381" font-size="12" font-weight="bold" fill="#222">VIA mode</text>
<text x="20" y="396" font-size="11" fill="#555">Fn + Ctrl + V: 2 blinks into VIA mode, 1 back to Vial (VIA shown)</text>
<rect x="470" y="382" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="376" width="20.0" height="16" rx="3" fill="#2f6fd6"/>
<rect x="510.0" y="376" width="20.0" height="16" rx="3" fill="#2f6fd6"/>
<text x="20" y="430" font-size="14" font-weight="bold" fill="#222">Orange</text>
<text x="464.0" y="430" font-size="10" fill="#888">0 s</text>
<text x="530.6666666666666" y="430" font-size="10" fill="#888">1 s</text>
<text x="597.3333333333334" y="430" font-size="10" fill="#888">2 s</text>
<text x="664.0" y="430" font-size="10" fill="#888">3 s</text>
<rect x="14" y="440" width="672" height="40" rx="3" fill="#f4f6f8"/>
<text x="20" y="457" font-size="12" font-weight="bold" fill="#222">Turning off</text>
<text x="20" y="472" font-size="11" fill="#555">Power switch held 2 s</text>
<rect x="470" y="458" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="452" width="66.7" height="16" rx="3" fill="#e8891c"/>
<text x="20" y="497" font-size="12" font-weight="bold" fill="#222">Pairings forgotten</text>
<text x="20" y="512" font-size="11" fill="#555">Fn + Ctrl + Q, then Fn + Ctrl + Delete + 1-4 or Z: always 3 blinks</text>
<rect x="470" y="498" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="492" width="20.0" height="16" rx="3" fill="#e8891c"/>
<rect x="510.0" y="492" width="20.0" height="16" rx="3" fill="#e8891c"/>
<rect x="550.0" y="492" width="20.0" height="16" rx="3" fill="#e8891c"/>
<rect x="14" y="520" width="672" height="53" rx="3" fill="#f4f6f8"/>
<text x="20" y="537" font-size="12" font-weight="bold" fill="#222">Host forgot keyboard</text>
<text x="20" y="552" font-size="11" fill="#555">5 quick blinks: the slot's host rejected its pairing; pair the slot</text>
<text x="20" y="565" font-size="11" fill="#555">again</text>
<rect x="470" y="538" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="532" width="13.3" height="16" rx="3" fill="#e8891c"/>
<rect x="496.7" y="532" width="13.3" height="16" rx="3" fill="#e8891c"/>
<rect x="523.3" y="532" width="13.3" height="16" rx="3" fill="#e8891c"/>
<rect x="550.0" y="532" width="13.3" height="16" rx="3" fill="#e8891c"/>
<rect x="576.7" y="532" width="13.3" height="16" rx="3" fill="#e8891c"/>
<text x="20" y="590" font-size="12" font-weight="bold" fill="#222">Batteries low</text>
<text x="20" y="605" font-size="11" fill="#555">One blink every ~33 s (on batteries, using Bluetooth)</text>
<rect x="470" y="591" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="585" width="40.0" height="16" rx="3" fill="#e8891c"/>
<rect x="14" y="613" width="672" height="40" rx="3" fill="#f4f6f8"/>
<text x="20" y="630" font-size="12" font-weight="bold" fill="#222">Replace batteries</text>
<text x="20" y="645" font-size="11" fill="#555">Two blinks every ~16.5 s (on batteries, using Bluetooth)</text>
<rect x="470" y="631" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="625" width="40.0" height="16" rx="3" fill="#e8891c"/>
<rect x="550.0" y="625" width="40.0" height="16" rx="3" fill="#e8891c"/>
<text x="20" y="670" font-size="12" font-weight="bold" fill="#222">Batteries empty</text>
<text x="20" y="685" font-size="11" fill="#555">At power-on, then the keyboard turns off</text>
<rect x="470" y="671" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="665" width="133.3" height="16" rx="3" fill="#e8891c"/>
<rect x="14" y="693" width="672" height="40" rx="3" fill="#f4f6f8"/>
<text x="20" y="710" font-size="12" font-weight="bold" fill="#222">Firmware update</text>
<text x="20" y="725" font-size="11" fill="#555">Solid while the main chip is being updated</text>
<rect x="470" y="711" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="705" width="200.0" height="16" rx="3" fill="#e8891c"/>
<text x="20" y="750" font-size="12" font-weight="bold" fill="#222">Bluetooth update</text>
<text x="20" y="765" font-size="11" fill="#555">Two blinks a second while the Bluetooth chip updates or recovers</text>
<rect x="470" y="751" width="200" height="4" rx="2" fill="#dde1e6"/>
<rect x="470.0" y="745" width="16.7" height="16" rx="3" fill="#e8891c"/>
<rect x="503.3" y="745" width="16.7" height="16" rx="3" fill="#e8891c"/>
<rect x="536.7" y="745" width="16.7" height="16" rx="3" fill="#e8891c"/>
<rect x="570.0" y="745" width="16.7" height="16" rx="3" fill="#e8891c"/>
<rect x="603.3" y="745" width="16.7" height="16" rx="3" fill="#e8891c"/>
<rect x="636.7" y="745" width="16.7" height="16" rx="3" fill="#e8891c"/>
</svg>
